<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo element
    </title>
    <style>
        h3::first-line {
            color: teal;

        }

        p::before {
            content: "❤️";
        }

        p::after {
            content: "👍";
        }

        h3::first-letter {
            color: red;
            fornt-size: 30px
        }

        h3::first-line {
            color: teal;
        }
    </style>
</head>

<body>
    <P> welcome to pseudo element</P>
    <h3>Lorem ipsum dolor sit amet consectetur adipisicing elit. Repudiandae laudantium impedit quia. Dignissimos quam
        maxime debitis neque corrupti necessitatibus, a quasi, exercitationem numquam nobis accusantium optio cum
        voluptas velit autem.</h3>

</body>

</html>
